<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fashion Forward, Fashion Reset || Welcome</title>
        <link rel="stylesheet" href="styles/default.css">
        <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
        <!-- https://coolors.co/dddbf1-de8f6e-4e3d42-436251-f6f7eb -->
    </head>
    <body>
        <header id="header">
            <div data-include="components/header.html"></div>
        </header>
        <main>
            <section id="hero-get-involved" class="section">
                <h2>Take Action to Make Fashion Sustainable</h2>
                <p>Help us make a difference - sign the petition!</p>
                <a href="#petition-form" class="cta-button">Sign the Petition</a>
            </section>
            <hr>

            <section id="petition-form" class="section">
                <h3>Sign the Petition</h3>
                <form action="/submit-petition" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="comments">Comments (Optional):</label>
                    <textarea id="comments" name="comments" rows="4"></textarea>
                    <button type="submit" class="submit-button">Submit</button>
                </form>
            </section>
    </main>

    <footer>
        <div data-include="components/footer.html"></div>
    </footer>
    <script src="scripts/include.js"></script>
</body>
</html>
